<body>
    <form id="search-form">
        <input type="text" placeholder="Rechercher..." id="search-bar">
        <button type="submit">Chercher</button>
    </form>

    <div id="results"></div>

    <script>
        const searchBar = document.getElementById('search-bar');
        const results = document.getElementById('results');
        const data = [
            { title: 'Résultat 1 : Exemple de contenu', url: 'https://example.com/contenu' },
            { title: 'Résultat 2 : Autre exemple', url: 'https://example.com/autre' },
            { title: 'Résultat 3 : Plus de contenu intéressant', url: 'https://example.com/interessant' },
            { title: 'Résultat 4 : Encore un autre exemple', url: 'https://example.com/autre-exemple' }
        ];

        document.getElementById('search-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const query = searchBar.value.toLowerCase();
            results.innerHTML = '';
            const filteredData = data.filter(item => item.title.toLowerCase().includes(query));
            filteredData.forEach(item => {
                const div = document.createElement('div');
                div.classList.add('result-item');
                const link = document.createElement('a');
                link.href = item.url;
                link.textContent = item.title;
                div.appendChild(link);
                results.appendChild(div);
            });
        });
    </script>
</body>
